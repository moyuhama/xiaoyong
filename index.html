<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16836c" />
    <meta
      name="description"
      content="小用工具箱，32 款日常与开发工具。图片编辑、PDF 合并提取、文本整理、配置转换、时间与计算工具。"
    />
    <title>小用 · 让每件小事更简单</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("xiaoyong-theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
